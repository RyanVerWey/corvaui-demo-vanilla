<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CorvaUI Vanilla Demo</title>
  </head>
  <body>
    <main class="app-shell" data-corva-theme="indigo-dark" id="app-shell">
      <corva-app-bar heading="CorvaUI Operations">
        <div class="app-bar-actions" slot="actions">
          <corva-badge tone="info" id="theme-badge">indigo-dark</corva-badge>
          <corva-button-group label="Theme mode">
            <corva-button id="theme-light" size="sm" variant="secondary">Light</corva-button>
            <corva-button id="theme-dark" size="sm">Dark</corva-button>
          </corva-button-group>
        </div>
      </corva-app-bar>

      <details class="mobile-menu">
        <summary>Menu</summary>
        <nav id="mobile-nav" aria-label="Mobile navigation"></nav>
      </details>

      <div class="app-main">
        <div class="app-layout">
          <corva-sidebar id="nav" heading="CorvaUI" label="Site sections"></corva-sidebar>
          <section class="route-panel" id="route-view" aria-live="polite"></section>
        </div>
      </div>

      <corva-snackbar id="snackbar" tone="success"></corva-snackbar>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
